<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<link id="favicon-link" rel="icon" href="">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style type="text/tailwindcss">
  body { font-family: 'Cairo', sans-serif; }
  .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
  .card { @apply bg-white dark:bg-slate-800 rounded-2xl shadow-sm; }
  .inp { @apply w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl p-3 text-sm focus:outline-indigo-500; }
  .btn { @apply bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl px-4 py-2.5 transition disabled:opacity-50; }
  .ghost { @apply bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl px-3 py-2 text-sm font-bold transition; }
  .chip { @apply px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap bg-white dark:bg-slate-800 shadow-sm transition; }
  .chip.on { @apply bg-indigo-600 text-white; }
  .sk { @apply animate-pulse bg-slate-200 dark:bg-slate-700 rounded-2xl h-72; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-16">

<div id="announce" class="hidden gradient-bg text-white text-center text-xs font-bold py-2 px-3"></div>

<!-- الشريط العلوي -->
<header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md shadow-sm sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <div id="ui-brand-container" class="flex items-center gap-2">
        <span id="ui-icon" class="bg-indigo-600 text-white p-2 rounded-xl text-lg hidden">🛍️</span>
        <img id="ui-logo" src="" alt="Logo" class="h-9 w-auto object-contain hidden">
      </div>
      <h1 id="ui-name" class="text-lg sm:text-xl font-black truncate bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">المتجر</h1>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="toggleDark()" class="ghost" title="الوضع الليلي">🌙</button>
      <button onclick="openTrack()" class="ghost" title="تتبع طلبك">📦 <span class="hidden sm:inline">تتبع</span></button>
      <button onclick="openWheel()" class="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-3 py-2 rounded-xl text-sm font-black shadow">🎡 <span class="hidden sm:inline">عجلة الحظ</span></button>
      <button onclick="toggleCart(true)" class="btn flex items-center gap-1 text-sm">🛒 <span id="cart-count" class="bg-rose-500 text-xs rounded-full px-2 py-0.5">0</span></button>
    </div>
  </div>
</header>

<!-- الترحيب + البحث -->
<section id="hero-section" class="gradient-bg text-white relative overflow-hidden">
  <div class="max-w-6xl mx-auto px-4 py-12 text-center relative z-10">
    <h2 id="hero-title" class="text-2xl sm:text-4xl font-black mb-2"></h2>
    <p id="hero-sub" class="text-indigo-100 mb-6 text-sm sm:text-base max-w-xl mx-auto"></p>
    <div class="relative max-w-xl mx-auto">
      <input id="search" oninput="state.q=this.value.trim().toLowerCase();renderProducts()" placeholder="🔍 دوّر على منتج..." class="w-full p-4 rounded-2xl text-slate-800 text-center font-bold outline-none shadow-xl dark:bg-slate-800 dark:text-white">
    </div>
  </div>
</section>

<!-- الفلاتر -->
<section class="max-w-6xl mx-auto px-4 mt-6">
  <div class="flex gap-2 overflow-x-auto pb-2" id="cats"></div>
  <div class="flex gap-2 mt-3 items-center flex-wrap">
    <select onchange="state.sort=this.value;renderProducts()" class="inp !w-auto">
      <option value="new">الأحدث</option>
      <option value="best">الأكثر مبيعاً</option>
      <option value="cheap">الأرخص</option>
      <option value="exp">الأغلى</option>
      <option value="disc">أعلى خصم</option>
    </select>
    <button id="wish-btn" onclick="state.onlyWish=!state.onlyWish;renderProducts()" class="ghost">❤️ المفضلة <span id="wish-count">0</span></button>
    <span id="res-count" class="text-xs text-slate-400 mr-auto"></span>
  </div>
</section>

<!-- المنتجات -->
<main class="max-w-6xl mx-auto px-4 mt-4">
  <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<footer class="text-center text-xs text-slate-400 mt-12 py-6 border-t dark:border-slate-800 px-4" id="footer"></footer>

<!-- زرار واتساب -->
<a id="wa-float" target="_blank" class="hidden fixed bottom-5 left-5 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl z-30 transition hover:scale-110">💬</a>

<!-- السلة -->
<div id="cart-overlay" onclick="toggleCart(false)" class="hidden fixed inset-0 bg-black/50 z-40 backdrop-blur-xs"></div>
<aside id="cart" class="fixed top-0 bottom-0 left-0 w-full max-w-sm bg-white dark:bg-slate-800 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col">
  <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center">
    <h3 class="font-black text-lg">🛒 سلة المشتريات</h3>
    <button onclick="toggleCart(false)" class="ghost">✕</button>
  </div>
  <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  <div class="p-4 border-t dark:border-slate-700 space-y-3">
    <div class="flex gap-2">
      <input id="coupon-in" placeholder="كود الخصم" class="inp uppercase">
      <button onclick="applyCoupon()" class="btn">تطبيق</button>
    </div>
    <div id="cart-totals" class="text-sm space-y-1"></div>
    <button onclick="checkout()" class="btn w-full py-3.5">إتمام الطلب ✅</button>
  </div>
</aside>

<!-- مودال عام -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">
  <div id="modal-body" class="card w-full max-w-lg max-h-[92vh] overflow-y-auto !rounded-b-none sm:!rounded-b-3xl !rounded-t-3xl p-5 shadow-2xl"></div>
</div>

<div id="toasts" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] space-y-2 pointer-events-none"></div>

<script>
/* ====== الإعدادات ====== */
const SUPABASE_URL = 'https://obmlxotktttofpxrdpwr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5Qd36HMri9ll-SdwKQ0_9A_oHmcbs9d';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jget = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const FALLBACK = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="50%" y="55%" font-size="64" text-anchor="middle">📦</text></svg>');
const STEPS = ['قيد المراجعة','تم التأكيد','جاري التجهيز','تم الشحن','تم التسليم'];

const state = {
  products: [], cats: [], settings: {}, rating: {}, prizes: [],
  cart: jget('cart', []), wish: jget('wish', []),
  cat: 'الكل', q: '', sort: 'new', onlyWish: false, coupon: null
};
const money = n => Number(n || 0).toLocaleString('ar-EG') + ' ' + (state.settings.currency || 'ج.م');
const dsc = p => p.old_price > p.price ? (p.old_price - p.price) / p.old_price : 0;

function toast(m, t = 'ok') {
  const d = document.createElement('div');
  d.className = 'px-4 py-2.5 rounded-xl text-sm font-bold text-white shadow-lg pointer-events-auto ' + (t === 'err' ? 'bg-rose-600' : 'bg-emerald-600');
  d.textContent = m; $('toasts').appendChild(d); setTimeout(() => d.remove(), 2800);
}
function modal(html) { $('modal-body').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }
function toggleDark() { const d = document.documentElement.classList.toggle('dark'); localStorage.dark = d ? '1' : '0'; }
const waNum = p => { p = String(p || '').replace(/\D/g, ''); return p.startsWith('0') ? '20' + p.slice(1) : p; };

/* ====== تحميل البيانات ====== */
async function loadAll() {
  const [p, c, s, r] = await Promise.all([
    db.from('products').select('*').eq('active', true).order('id', { ascending: false }),
    db.from('categories').select('*').order('sort_order'),
    db.from('settings').select('*'),
    db.from('reviews').select('product_id,rating').eq('approved', true)
  ]);
  if (p.error) { $('grid').innerHTML = '<p class="col-span-full text-center text-rose-600 font-bold">مشكلة في الاتصال بقاعدة البيانات</p>'; return false; }
  state.products = p.data || []; state.cats = c.data || [];
  state.settings = Object.fromEntries((s.data || []).map(x => [x.key, x.value]));
  state.rating = {};
  (r.data || []).forEach(x => { const o = state.rating[x.product_id] ||= { sum: 0, n: 0 }; o.sum += x.rating; o.n++; });
  return true;
}

function applySettings() {
  const s = state.settings;
  $('ui-name').textContent = s.store_name || 'المتجر';
  document.title = s.store_name || 'المتجر';

  // التعامل مع الشعار أو الأيقونة
  if (s.store_logo) {
    $('ui-logo').src = s.store_logo;
    $('ui-logo').classList.remove('hidden');
    $('ui-icon').classList.add('hidden');
  } else {
    $('ui-icon').textContent = s.store_icon || '🛍️';
    $('ui-icon').classList.remove('hidden');
    $('ui-logo').classList.add('hidden');
  }

  // الـ Favicon
  if (s.store_favicon) $('favicon-link').href = s.store_favicon;

  // صورة الغلاف للـ Hero لو موجودة
  if (s.hero_image) {
    $('hero-section').style.background = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${s.hero_image}') center/cover`;
  }

  $('hero-title').textContent = s.hero_title || ''; 
  $('hero-sub').textContent = s.hero_subtitle || '';
  $('footer').textContent = s.footer_text || '';
  
  if (s.announcement) { $('announce').textContent = s.announcement; $('announce').classList.remove('hidden'); }
  if (s.whatsapp) { $('wa-float').href = 'https://wa.me/' + waNum(s.whatsapp); $('wa-float').classList.remove('hidden'); }
}

/* ====== عرض المنتجات ====== */
function renderCats() {
  const all = ['الكل', ...state.cats.map(c => c.name)];
  $('cats').innerHTML = all.map(n => {
    const c = state.cats.find(x => x.name === n);
    return `<button onclick="state.cat='${esc(n).replace(/'/g,'')}';renderCats();renderProducts()" class="chip ${state.cat === n ? 'on' : ''}">${c ? esc(c.icon) + ' ' : ''}${esc(n)}</button>`;
  }).join('');
}

function filtered() {
  let l = state.products.filter(p =>
    (state.cat === 'الكل' || p.category === state.cat) &&
    (!state.q || (p.name + ' ' + (p.description || '')).toLowerCase().includes(state.q)) &&
    (!state.onlyWish || state.wish.includes(p.id)));
  const f = { cheap: (a, b) => a.price - b.price, exp: (a, b) => b.price - a.price,
              best: (a, b) => (b.sales_count || 0) - (a.sales_count || 0), disc: (a, b) => dsc(b) - dsc(a) }[state.sort];
  if (f) l.sort(f);
  return l;
}

function stars(id) {
  const r = state.rating[id]; if (!r) return '';
  return `<div class="text-xs text-amber-500 font-bold">${'★'.repeat(Math.round(r.sum / r.n))}<span class="text-slate-400"> (${r.n})</span></div>`;
}

function card(p) {
  const d = Math.round(dsc(p) * 100), out = p.stock <= 0, fav = state.wish.includes(p.id);
  return `<div class="card overflow-hidden flex flex-col hover:shadow-xl transition">
    <div class="relative cursor-pointer" onclick="openProduct(${p.id})">
      <img src="${esc(p.image)}" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK" class="w-full h-40 sm:h-44 object-cover ${out ? 'opacity-40' : ''}">
      ${d ? `<span class="absolute top-2 right-2 bg-rose-500 text-white text-xs font-black px-2 py-1 rounded-lg">-${d}%</span>` : ''}
      ${p.featured ? `<span class="absolute bottom-2 right-2 bg-amber-400 text-slate-900 text-[10px] font-black px-2 py-1 rounded-lg">⭐ مميز</span>` : ''}
      ${!out && p.stock <= 5 ? `<span class="absolute bottom-2 left-2 bg-orange-500 text-white text-[10px] font-black px-2 py-1 rounded-lg">باقي ${p.stock} بس</span>` : ''}
      ${out ? `<span class="absolute inset-0 flex items-center justify-center"><b class="bg-slate-900 text-white px-3 py-1 rounded-xl text-sm">نفدت الكمية</b></span>` : ''}
      <button onclick="event.stopPropagation();toggleWish(${p.id})" class="absolute top-2 left-2 bg-white/90 rounded-full w-8 h-8 shadow flex items-center justify-center">${fav ? '❤️' : '🤍'}</button>
    </div>
    <div class="p-3 flex flex-col flex-1 gap-1">
      <span class="text-[11px] text-indigo-500 font-bold">${esc(p.category)}</span>
      <h3 class="font-bold text-sm leading-snug line-clamp-2 cursor-pointer" onclick="openProduct(${p.id})">${esc(p.name)}</h3>
      ${stars(p.id)}
      <div class="mt-auto flex items-baseline gap-2 pt-1">
        <b class="text-indigo-600 dark:text-indigo-400 font-black">${money(p.price)}</b>
        ${p.old_price > p.price ? `<s class="text-xs text-slate-400">${money(p.old_price)}</s>` : ''}
      </div>
      <button ${out ? 'disabled' : ''} onclick="addToCart(${p.id})" class="btn text-sm mt-1">${out ? 'غير متوفر' : 'أضف للسلة 🛒'}</button>
    </div></div>`;
}

function renderProducts() {
  const l = filtered();
  $('grid').innerHTML = l.length ? l.map(card).join('') : '<p class="col-span-full text-center text-slate-400 py-16 font-bold">مفيش منتجات مطابقة 😕</p>';
  $('res-count').textContent = l.length + ' منتج';
  $('wish-count').textContent = state.wish.length;
  $('wish-btn').classList.toggle('!bg-rose-100', state.onlyWish);
}

function toggleWish(id) {
  state.wish = state.wish.includes(id) ? state.wish.filter(x => x !== id) : [...state.wish, id];
  localStorage.setItem('wish', JSON.stringify(state.wish)); renderProducts();
}

/* ====== تفاصيل المنتج + التقييمات ====== */
async function openProduct(id) {
  const p = state.products.find(x => x.id === id); if (!p) return;
  const imgs = [p.image, ...(p.images || [])].filter(Boolean);
  const { data: rv } = await db.from('reviews').select('*').eq('product_id', id).eq('approved', true).order('id', { ascending: false });
  const wa = state.settings.whatsapp ? `https://wa.me/?text=${encodeURIComponent(p.name + ' - ' + location.href)}` : '';
  modal(`
    <div class="flex justify-between mb-2"><h3 class="font-black text-lg">${esc(p.name)}</h3><button onclick="closeModal()" class="ghost">✕</button></div>
    <img id="pimg" src="${esc(imgs[0])}" onerror="this.onerror=null;this.src=FALLBACK" class="w-full h-60 object-cover rounded-2xl mb-2">
    ${imgs.length > 1 ? `<div class="flex gap-2 mb-3 overflow-x-auto">${imgs.map(u => `<img src="${esc(u)}" onclick="$('pimg').src=this.src" class="w-14 h-14 rounded-lg object-cover cursor-pointer border">`).join('')}</div>` : ''}
    <div class="flex items-baseline gap-2 mb-1"><b class="text-2xl text-indigo-600 font-black">${money(p.price)}</b>${p.old_price > p.price ? `<s class="text-slate-400">${money(p.old_price)}</s>` : ''}</div>
    ${stars(id)}
    <p class="text-sm text-slate-600 dark:text-slate-300 my-3 whitespace-pre-line">${esc(p.description || '')}</p>
    <p class="text-xs mb-3 ${p.stock > 0 ? 'text-emerald-600' : 'text-rose-600'} font-bold">${p.stock > 0 ? 'متوفر: ' + p.stock + ' قطعة' : 'نفدت الكمية'}</p>
    <div class="flex gap-2 mb-4">
      <input id="pq" type="number" min="1" max="${p.stock}" value="1" class="inp !w-20 text-center">
      <button ${p.stock <= 0 ? 'disabled' : ''} onclick="addToCart(${p.id},Math.max(1,parseInt($('pq').value)||1));closeModal()" class="btn flex-1">أضف للسلة 🛒</button>
      ${wa ? `<a href="${wa}" target="_blank" class="ghost flex items-center">📤</a>` : ''}
    </div>
    <h4 class="font-black mb-2">التقييمات (${(rv || []).length})</h4>
    <div class="space-y-2 mb-4 max-h-40 overflow-y-auto">${(rv || []).map(r => `<div class="bg-slate-50 dark:bg-slate-700 rounded-xl p-3 text-sm"><b>${esc(r.name)}</b> <span class="text-amber-500">${'★'.repeat(r.rating)}</span><p class="text-slate-600 dark:text-slate-300">${esc(r.comment || '')}</p></div>`).join('') || '<p class="text-xs text-slate-400">لسه مفيش تقييمات، كن أول واحد!</p>'}</div>
    <form onsubmit="sendReview(event,${id})" class="space-y-2 border-t dark:border-slate-700 pt-3">
      <div class="flex gap-2"><input name="rn" required placeholder="اسمك" class="inp">
      <select name="rr" class="inp !w-28"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></div>
      <textarea name="rc" rows="2" placeholder="رأيك في المنتج" class="inp"></textarea>
      <button class="btn w-full">إرسال التقييم</button>
    </form>`);
}

async function sendReview(e, id) {
  e.preventDefault(); const f = e.target;
  const { error } = await db.from('reviews').insert({ product_id: id, name: f.rn.value.trim(), rating: +f.rr.value, comment: f.rc.value.trim() });
  if (error) return toast('حصلت مشكلة، جرب تاني', 'err');
  toast('شكراً! التقييم هيظهر بعد المراجعة'); closeModal();
}

/* ====== السلة ====== */
const saveCart = () => localStorage.setItem('cart', JSON.stringify(state.cart));
function toggleCart(open) {
  $('cart').classList.toggle('-translate-x-full', !open);
  $('cart-overlay').classList.toggle('hidden', !open);
}
function addToCart(id, qty = 1) {
  const p = state.products.find(x => x.id === id);
  if (!p || p.stock <= 0) return toast('المنتج غير متاح', 'err');
  const it = state.cart.find(x => x.id === id), now = it ? it.qty : 0;
  if (now + qty > p.stock) return toast('وصلت للحد الأقصى المتاح من المنتج', 'err');
  it ? it.qty += qty : state.cart.push({ id, qty });
  renderCart(); refreshCoupon(); toast('اتضاف للسلة ✅');
}

function changeQty(id, d) {
  const it = state.cart.find(x => x.id === id), p = state.products.find(x => x.id === id);
  if (!it || !p) return;
  const n = it.qty + d;
  if (n <= 0) state.cart = state.cart.filter(x => x.id !== id);
  else if (n > p.stock) return toast('الكمية المتاحة ' + p.stock + ' بس', 'err');
  else it.qty = n;
  renderCart(); refreshCoupon();
}

function calc() {
  const L = state.cart.map(i => ({ ...i, p: state.products.find(x => x.id === i.id) })).filter(l => l.p);
  const sub = L.reduce((a, l) => a + l.p.price * l.qty, 0);
  const disc = Math.min(sub, state.coupon?.discount || 0);
  const fee = +state.settings.shipping_fee || 0, free = +state.settings.free_shipping_min || 0;
  const ship = !sub || (free > 0 && sub - disc >= free) ? 0 : fee;
  return { L, sub, disc, ship, free, total: sub - disc + ship };
}

function renderCart() {
  const c = calc();
  state.cart = c.L.map(l => ({ id: l.id, qty: l.qty })); saveCart();
  $('cart-count').textContent = state.cart.reduce((a, i) => a + i.qty, 0);
  $('cart-items').innerHTML = c.L.length ? c.L.map(l => `
    <div class="flex gap-3 items-center bg-slate-50 dark:bg-slate-700 rounded-xl p-2">
      <img src="${esc(l.p.image)}" onerror="this.onerror=null;this.src=FALLBACK" class="w-16 h-16 rounded-lg object-cover">
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold truncate">${esc(l.p.name)}</p>
        <p class="text-xs text-indigo-600 font-black">${money(l.p.price * l.qty)}</p>
        <div class="flex items-center gap-2 mt-1">
          <button onclick="changeQty(${l.id},-1)" class="ghost !px-2 !py-0.5">−</button><b>${l.qty}</b>
          <button onclick="changeQty(${l.id},1)" class="ghost !px-2 !py-0.5">+</button>
        </div>
      </div>
      <button onclick="changeQty(${l.id},-999)" class="text-rose-500 px-2">🗑️</button>
    </div>`).join('') : '<p class="text-center text-slate-400 py-16 font-bold">السلة فاضية 🛒</p>';
  renderTotals();
}

function renderTotals() {
  const c = calc();
  const hint = c.free > 0 && c.sub > 0 && c.sub - c.disc < c.free
    ? `<p class="text-xs text-emerald-600 font-bold">فاضل ${money(c.free - (c.sub - c.disc))} وتاخد شحن مجاني 🚚</p>` : '';
  $('cart-totals').innerHTML = `
    <div class="flex justify-between"><span>المجموع</span><b>${money(c.sub)}</b></div>
    ${c.disc ? `<div class="flex justify-between text-emerald-600"><span>خصم (${esc(state.coupon.code)})</span><b>- ${money(c.disc)}</b></div>` : ''}
    <div class="flex justify-between"><span>الشحن</span><b>${c.sub ? (c.ship ? money(c.ship) : 'مجاني') : '-'}</b></div>
    <div class="flex justify-between text-lg font-black border-t dark:border-slate-700 pt-2"><span>الإجمالي</span><span class="text-indigo-600">${money(c.total)}</span></div>${hint}`;
}

async function applyCoupon(code) {
  code = (code || $('coupon-in').value).trim(); if (!code) return;
  const { data, error } = await db.rpc('validate_coupon', { p_code: code, p_subtotal: calc().sub });
  if (error || !data.valid) { state.coupon = null; renderTotals(); return toast(data?.message || 'كوبون غلط', 'err'); }
  state.coupon = { code: data.code, discount: data.discount }; $('coupon-in').value = data.code;
  renderTotals(); toast(data.message);
}

async function refreshCoupon() {
  if (!state.coupon) return;
  const { data } = await db.rpc('validate_coupon', { p_code: state.coupon.code, p_subtotal: calc().sub });
  state.coupon = data && data.valid ? { code: data.code, discount: data.discount } : null;
  renderTotals();
}

/* ====== إتمام الطلب ====== */
function checkout() {
  const c = calc(); if (!c.L.length) return toast('السلة فاضية', 'err');
  const u = jget('cust', {});
  const pays = (state.settings.payment_methods || 'كاش عند الاستلام').split(',').map(s => s.trim()).filter(Boolean);
  modal(`
    <div class="flex justify-between mb-3"><h3 class="font-black text-lg">بيانات التوصيل 🚚</h3><button onclick="closeModal()" class="ghost">✕</button></div>
    <form onsubmit="submitOrder(event)" class="space-y-3">
      <input name="c_name" required placeholder="الاسم بالكامل" value="${esc(u.name)}" class="inp">
      <input name="c_phone" required type="tel" pattern="[0-9+ ]{10,15}" placeholder="رقم الموبايل" value="${esc(u.phone)}" class="inp">
      <input name="c_city" required placeholder="المحافظة / المدينة" value="${esc(u.city)}" class="inp">
      <textarea name="c_address" required rows="2" placeholder="العنوان بالتفصيل" class="inp">${esc(u.address)}</textarea>
      <textarea name="c_notes" rows="2" placeholder="ملاحظات (اختياري)" class="inp"></textarea>
      <select name="c_pay" class="inp">${pays.map(x => `<option>${esc(x)}</option>`).join('')}</select>
      <div class="bg-indigo-50 dark:bg-slate-700 rounded-xl p-3 text-sm space-y-1">
        <div class="flex justify-between"><span>المنتجات</span><b>${money(c.sub)}</b></div>
        ${c.disc ? `<div class="flex justify-between text-emerald-600"><span>الخصم</span><b>- ${money(c.disc)}</b></div>` : ''}
        <div class="flex justify-between"><span>الشحن</span><b>${c.ship ? money(c.ship) : 'مجاني'}</b></div>
        <div class="flex justify-between font-black text-base border-t pt-1"><span>الإجمالي</span><span>${money(c.total)}</span></div>
      </div>
      <button id="ord-btn" class="btn w-full py-3.5">تأكيد الطلب ✅</button>
    </form>`);
}

async function submitOrder(e) {
  e.preventDefault(); const f = e.target.elements, btn = $('ord-btn');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  const cust = { name: f.c_name.value.trim(), phone: f.c_phone.value.trim(), city: f.c_city.value.trim(), address: f.c_address.value.trim() };
  const { data, error } = await db.rpc('create_order', {
    p_name: cust.name, p_phone: cust.phone, p_address: cust.address, p_city: cust.city,
    p_notes: f.c_notes.value.trim(), p_payment: f.c_pay.value,
    p_items: state.cart.map(i => ({ id: i.id, qty: i.qty })), p_coupon: state.coupon?.code || null
  });
  if (error) { btn.disabled = false; btn.textContent = 'تأكيد الطلب ✅'; return toast(error.message, 'err'); }
  const lines = calc().L.map(l => `• ${l.p.name} × ${l.qty}`).join('\n');
  localStorage.setItem('cust', JSON.stringify(cust));
  localStorage.setItem('lastOrder', JSON.stringify({ id: data.id, phone: cust.phone }));
  state.cart = []; state.coupon = null; $('coupon-in').value = ''; renderCart(); toggleCart(false);
  await loadAll(); renderProducts();
  const msg = encodeURIComponent(`طلب جديد رقم #${data.id}\nالاسم: ${cust.name}\nالموبايل: ${cust.phone}\n${lines}\nالإجمالي: ${data.total}`);
  const wa = state.settings.whatsapp ? `<a target="_blank" href="https://wa.me/${waNum(state.settings.whatsapp)}?text=${msg}" class="block bg-green-500 text-white text-center font-black rounded-xl py-3 mb-2">تأكيد الطلب على واتساب 💬</a>` : '';
  modal(`<div class="text-center py-4"><div class="text-6xl mb-2">🎉</div>
    <h3 class="font-black text-xl mb-1">تم استلام طلبك</h3>
    <p class="text-slate-500 text-sm mb-1">رقم الطلب</p><p class="text-3xl font-black text-indigo-600 mb-1">#${data.id}</p>
    <p class="text-sm mb-4">الإجمالي: <b>${money(data.total)}</b> — احتفظ برقم الطلب لتتبعه</p>
    ${wa}<button onclick="openTrack()" class="ghost w-full mb-2">📦 تتبع الطلب</button>
    <button onclick="closeModal()" class="ghost w-full">متابعة التسوق</button></div>`);
}

/* ====== تتبع الطلب ====== */
function openTrack() {
  const l = jget('lastOrder', {});
  modal(`<div class="flex justify-between mb-3"><h3 class="font-black text-lg">📦 تتبع طلبك</h3><button onclick="closeModal()" class="ghost">✕</button></div>
    <div class="space-y-2"><input id="t_id" type="number" placeholder="رقم الطلب" value="${esc(l.id)}" class="inp">
    <input id="t_phone" type="tel" placeholder="رقم الموبايل اللي طلبت بيه" value="${esc(l.phone)}" class="inp">
    <button onclick="doTrack()" class="btn w-full">بحث</button></div><div id="track-res" class="mt-4"></div>`);
  if (l.id) doTrack();
}

async function doTrack() {
  const id = parseInt($('t_id').value), ph = $('t_phone').value.trim();
  if (!id || !ph) return toast('اكتب رقم الطلب والموبايل', 'err');
  const { data } = await db.rpc('track_order', { p_id: id, p_phone: ph });
  if (!data) { $('track-res').innerHTML = '<p class="text-rose-600 font-bold text-center">مفيش طلب بالبيانات دي</p>'; return; }
  const idx = STEPS.indexOf(data.status), canceled = data.status === 'ملغي';
  $('track-res').innerHTML = `
    <p class="text-sm mb-3">أهلاً <b>${esc(data.customer_name)}</b> — إجمالي الطلب <b>${money(data.total_price)}</b></p>
    ${canceled ? '<p class="bg-rose-100 text-rose-700 font-black text-center rounded-xl p-3">❌ الطلب ده اتلغى</p>' :
    `<ol class="space-y-2">${STEPS.map((s, i) => `<li class="flex items-center gap-3 ${i <= idx ? 'text-emerald-600 font-black' : 'text-slate-400'}">
      <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs ${i <= idx ? 'bg-emerald-500 text-white' : 'bg-slate-200 dark:bg-slate-700'}">${i <= idx ? '✓' : i + 1}</span>${s}</li>`).join('')}</ol>`}
    <div class="mt-3 text-xs text-slate-500">${(data.items || []).map(i => `${esc(i.name)} × ${i.qty}`).join(' • ')}</div>`;
}

/* ====== عجلة الحظ ====== */
async function openWheel() {
  const { data } = await db.from('wheel_prizes').select('*').order('id');
  state.prizes = data || [];
  if (state.prizes.length < 2) return toast('العجلة مش متاحة دلوقتي', 'err');
  modal(`<div class="flex justify-between mb-2"><h3 class="font-black text-lg">🎡 عجلة الحظ</h3><button onclick="closeModal()" class="ghost">✕</button></div>
    <p class="text-sm text-slate-500 text-center mb-3">لف العجلة مرة كل يوم واكسب كوبون خصم!</p>
    <div class="relative w-[300px] h-[300px] mx-auto">
      <div class="absolute -top-3 left-1/2 -translate-x-1/2 text-3xl z-10">🔻</div>
      <canvas id="wheel" width="300" height="300" class="rounded-full shadow-xl border-4 border-amber-400" style="transition:transform 5s cubic-bezier(.17,.67,.12,1)"></canvas>
    </div>
    <button id="spin-btn" onclick="spin()" class="btn w-full mt-4 py-3.5 !bg-amber-500 hover:!bg-amber-600">لف العجلة 🎯</button>
    <div id="spin-res" class="mt-3 text-center"></div>`);
  const c = $('wheel'), x = c.getContext('2d'), n = state.prizes.length, a = 2 * Math.PI / n, r = 150;
  const cols = ['#6366f1', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#06b6d4'];
  state.prizes.forEach((p, i) => {
    x.beginPath(); x.moveTo(r, r); x.arc(r, r, r, -Math.PI / 2 + i * a, -Math.PI / 2 + (i + 1) * a);
    x.fillStyle = cols[i % cols.length]; x.fill();
    x.save(); x.translate(r, r); x.rotate(-Math.PI / 2 + i * a + a / 2);
    x.fillStyle = '#fff'; x.font = 'bold 15px Cairo'; x.textAlign = 'right'; x.fillText(p.label, r - 14, 5); x.restore();
  });
}

async function spin() {
  const today = new Date().toDateString();
  if (localStorage.getItem('wheel_day') === today) return toast('جربت النهاردة، تعالى بكرة 🎡', 'err');
  $('spin-btn').disabled = true;
  const { data, error } = await db.rpc('claim_wheel_prize');
  if (error || !data?.ok) { $('spin-btn').disabled = false; return toast('حصلت مشكلة، جرب تاني', 'err'); }
  localStorage.setItem('wheel_day', today);
  const i = state.prizes.findIndex(p => p.id === data.prize_id), n = state.prizes.length;
  $('wheel').style.transform = `rotate(${360 * 6 - (i + 0.5) * 360 / n}deg)`;
  setTimeout(() => {
    $('spin-res').innerHTML = data.code
      ? `<p class="font-black text-lg text-emerald-600 mb-1">🎉 مبروك! كسبت ${esc(data.label)}</p>
         <p class="text-sm mb-2">الكود (صالح 7 أيام، استخدام مرة واحدة):</p>
         <div class="bg-amber-100 text-amber-800 font-black text-xl rounded-xl py-2 mb-2 select-all">${esc(data.code)}</div>
         <button onclick="closeModal();toggleCart(true);applyCoupon('${esc(data.code)}')" class="btn w-full">استخدم الكوبون دلوقتي</button>`
      : `<p class="font-black text-lg text-slate-500">حظ أوفر المرة الجاية 😅</p>`;
  }, 5200);
}

/* ====== التشغيل الفوري ====== */
(async function init() {
  if (localStorage.dark === '1') document.documentElement.classList.add('dark');
  if (!(await loadAll())) return;
  applySettings(); renderCats(); renderProducts(); renderCart(); refreshCoupon();
})();
</script>
</body>
